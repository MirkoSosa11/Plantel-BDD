<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión del plantel</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--tx:#17201a;--mu:#5d6b61;--ac:#1f7a43;--ac2:#e6f2ea;--bd:#dde3dd;--dg:#b3261e;

:root[data-theme="dark"]{--bg:#101512;--card:#1a211c;--tx:#e8eee9;--mu:#9aa89e;--ac:#46b574;--ac2:#1f3326;--bd:#2c372f;--dg:#f2766e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:0 0 12px}h2{font-size:1.15rem;margin:22px 0 8px}
.nav{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto}

.nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sub{color:var(--mu);margin:0 0 14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
.bar input{flex:2 1 200px;width:auto}.bar select{flex:1 1 150px;width:auto}
button{border:0;border-radius:10px;padding:9px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--ac2);color:var(--ac)}button.del{background:transparent;color:var(--dg);padding:6px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}

label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:10px}.row>div{flex:1}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.pitch{position:relative;aspect-ratio:3/4;max-width:520px;margin:0 auto;background:#2f8f55;border:2px solid #ffffff99;border-radius:8px}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #ffffff88}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid #ffffff88;border-radius:50%}
.slot{position:absolute;transform:translate(-50%,-50%);width:84px;text-align:center;cursor:pointer;z-index:1}

.note{font-size:.82rem;color:var(--mu);margin-top:18px}
.dbwrap{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:20px;align-items:start}.mapcol{position:sticky;top:8px}.dbwrap .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

.chipsel{display:flex;flex-wrap:wrap;gap:6px}.chipsel button{background:var(--card);color:var(--mu);border:1px solid var(--bd);padding:4px 10px;font-weight:500;border-radius:999px}.chipsel button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style>
</head>

function sheet(){
  const W=1240,H=1754,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d"),m=cur;
  const F=(w,s)=>x.font=w+" "+s+"px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#1f7a43";x.fillRect(0,0,W,16);
  x.textAlign="center";x.fillStyle="#17201a";F("800",64);x.fillText("CITACIÓN",W/2,100);
  F("700",46);x.fillText("vs "+(m.rival||"Rival"),W/2,166);
  F("500",30);x.fillStyle="#5d6b61";x.fillText([m.torneo,fdate(m.fecha),m.lugar,"Formación "+m.formacion].filter(Boolean).join("  ·  "),W/2,214);
  const px=200,py=250,pw=840,ph=1030;
  x.fillStyle="#2f8f55";x.fillRect(px,py,pw,ph);x.strokeStyle="rgba(255,255,255,.85)";x.lineWidth=4;x.strokeRect(px,py,pw,ph);
  x.beginPath();x.moveTo(px,py+ph/2);x.lineTo(px+pw,py+ph/2);x.stroke();
  x.beginPath();x.arc(px+pw/2,py+ph/2,100,0,7);x.stroke();
  x.strokeRect(px+pw/2-200,py,400,120);x.strokeRect(px+pw/2-200,py+ph-120,400,120);
  slots(m.formacion).forEach((s,i)=>{
    const sx=px+s.x/100*pw,sy=py+s.y/100*ph,id=m.tit[i];
    x.beginPath();x.arc(sx,sy,32,0,7);x.fillStyle="#fff";x.fill();x.lineWidth=5;x.strokeStyle="#1f7a43";x.stroke();

    if(id){const w=pn(id).split(" "),l=w.length>1?[w.slice(0,-1).join(" "),w[w.length-1]]:[w[0]];
      F("800",27);x.lineWidth=5;x.strokeStyle="#000";l.forEach((t,k)=>{x.strokeText(t,sx,sy+66+k*30);});x.fillStyle="#fff";l.forEach((t,k)=>{x.fillText(t,sx,sy+66+k*30)})}
  });
  const y0=1340;x.textAlign="left";x.fillStyle="#1f7a43";F("800",34);x.fillText("SUPLENTES",90,y0);x.fillText("CUERPO TÉCNICO",660,y0);
  x.fillStyle="#17201a";F("500",30);

  (m.staff||"").split("\n").filter(t=>t.trim()).slice(0,9).forEach((t,i)=>x.fillText(t.trim(),660,y0+50+i*40));
  return c;
}
function makePdf(jpg,w,h){const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const add=b=>{b=typeof b==="string"?enc.encode(b):b;parts.push(b);len+=b.length};
  const obj=(n,s)=>{off[n]=len;add(n+" 0 obj\n"+s+"\nendobj\n")};
  add("%PDF-1.4\n");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>");
  const cs="q 595 0 0 842 0 0 cm /Im0 Do Q";obj(4,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
  off[5]=len;add("5 0 obj\n<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");add(jpg);add("\nendstream\nendobj\n");
  const xr=len;let s="xref\n0 6\n0000000000 65535 f \n";for(let i=1;i<=5;i++)s+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  add(s+"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function exportSheet(kind){
  let dl=null;try{dl=await claude.use("downloads")}catch(e){}
  const save=async(n,d)=>{if(dl)return dl.save({filename:n,data:d});const a=document.createElement("a");a.href=URL.createObjectURL(d);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
  const cv=sheet(),blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.92));
  const base="citacion-"+(cur.rival||"partido").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-")+(cur.fecha?"-"+cur.fecha:"");
  try{if(kind==="jpg")await save(base+".jpg",blob);else await save(base+".pdf",makePdf(new Uint8Array(await blob.arrayBuffer()),cv.width,cv.height))}
  catch(e){if(!e||e.code!=="declined")alert("No se pudo descargar el archivo.")}
}
