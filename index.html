<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión del plantel</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--tx:#17201a;--mu:#5d6b61;--ac:#1f7a43;--ac2:#e6f2ea;--bd:#dde3dd;--dg:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--card:#1a211c;--tx:#e8eee9;--mu:#9aa89e;--ac:#46b574;--ac2:#1f3326;--bd:#2c372f;--dg:#f2766e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101512;--card:#1a211c;--tx:#e8eee9;--mu:#9aa89e;--ac:#46b574;--ac2:#1f3326;--bd:#2c372f;--dg:#f2766e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;margin:0 0 12px}h2{font-size:1.15rem;margin:22px 0 8px}
.nav{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto}
.nav button{background:var(--card);color:var(--mu);border:1px solid var(--bd);white-space:nowrap}
.nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sub{color:var(--mu);margin:0 0 14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
.bar input{flex:2 1 200px;width:auto}.bar select{flex:1 1 150px;width:auto}
button{border:0;border-radius:10px;padding:9px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--ac2);color:var(--ac)}button.del{background:transparent;color:var(--dg);padding:6px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.card h3{margin:0 0 6px;font-size:1.05rem}
.tags{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tag{background:var(--ac2);color:var(--ac);border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600}
.card p{margin:0 0 12px;color:var(--mu);white-space:pre-wrap;font-size:.94rem}
.acts{display:flex;gap:6px}.empty{color:var(--mu);text-align:center;padding:36px 0}
.grp{grid-column:1/-1;font-weight:700;margin-top:8px;color:var(--ac)}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(460px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:10px}.row>div{flex:1}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.pitch{position:relative;aspect-ratio:3/4;max-width:520px;margin:0 auto;background:#2f8f55;border:2px solid #ffffff99;border-radius:8px}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #ffffff88}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid #ffffff88;border-radius:50%}
.slot{position:absolute;transform:translate(-50%,-50%);width:84px;text-align:center;cursor:pointer;z-index:1}
.shirt{width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--tx);display:grid;place-items:center;font-weight:700;margin:0 auto;border:2px solid var(--ac)}
.slot.empty-s .shirt{opacity:.55;border-style:dashed}
.sn{font-size:.7rem;color:#fff;font-weight:700;text-shadow:0 1px 2px #000;line-height:1.1;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--ac2);color:var(--tx);border-radius:999px;padding:4px 6px 4px 12px;display:flex;align-items:center;gap:4px;font-size:.9rem}
.chip button{padding:0 8px;background:transparent;color:var(--dg)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;font-size:.8rem}
.stp{display:inline-flex;align-items:center;gap:6px}.stp button{padding:2px 9px;background:var(--ac2);color:var(--ac)}
td input{width:70px;padding:5px 8px;text-align:center}
.pl{display:flex;justify-content:space-between;padding:10px 6px;border-bottom:1px solid var(--bd);cursor:pointer}
.note{font-size:.82rem;color:var(--mu);margin-top:18px}
</style>
</head>
<body>
<main>
<h1>⚽ Gestión del plantel</h1>
<div class="nav" id="nav"></div>
<div id="app"></div>
<p class="note" id="note"></p>
</main>
<dialog id="dlg"></dialog>

<script>
const POS=["Arquero","Defensor central","Lateral derecho","Lateral izquierdo","Mediocampista defensivo","Mediocampista central","Mediocampista ofensivo","Extremo","Delantero"];
const FORM=["4-4-2","4-3-3","4-2-3-1","3-5-2","4-5-1","5-3-2","3-4-3","4-1-4-1"];

let D={players:[],matches:[]},db=null,canEdit=false,local=false,v="db",cur=null,fcat="",fpos="",q="";
const $=id=>document.getElementById(id);

const pn=id=>(D.players.find(p=>p.id===id)||{}).nombre||"(eliminada)";
const fdate=s=>s?new Date(s+"T12:00:00").toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"}):"";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

let tm;const saveCur=()=>{clearTimeout(tm);tm=setTimeout(()=>put("matches",JSON.parse(JSON.stringify(cur)),true).catch(()=>alert("No se pudo guardar el partido.")),500)};
function slots(f){const p=f.split("-").map(Number),n=p.length,s=[{x:50,y:9}];p.forEach((c,i)=>{const y=27+i*(62/(n-1));for(let j=0;j<c;j++)s.push({x:(j+1)/(c+1)*100,y})});return s}

const dlg=(...k)=>{const d=$("dlg");d.textContent="";d.append(...k);if(!d.open)d.showModal();return d};

/* ---------- Base de datos ---------- */
function viewDb(){
  const used=[...new Set(D.players.map(p=>p.categoria).filter(Boolean))].sort();
  const bar=h("div",{class:"bar"},
    h("input",{type:"search",placeholder:"Buscar por nombre o característica…",value:q,oninput:e=>{q=e.target.value;draw()}}),
    h("select",{value:fcat,onchange:e=>{fcat=e.target.value;draw()}},h("option",{value:""},"Todas las categorías"),used.map(c=>h("option",{value:c},c))),
    h("select",{value:fpos,onchange:e=>{fpos=e.target.value;draw()}},h("option",{value:""},"Todas las posiciones"),POS.map(c=>h("option",{value:c},c))),
    canEdit&&h("button",{onclick:()=>form(null)},"+ Nuevo jugador"));

        canEdit&&h("div",{class:"acts"},h("button",{class:"sec",onclick:()=>form(p)},"Editar"),h("button",{class:"del",onclick:async()=>{if(confirm("¿Eliminar la ficha de "+p.nombre+"?"))try{await del("players",p.id)}catch(e){alert("No se pudo eliminar.")}}},"Eliminar"))));

function form(p){

  dlg(h("h2",{style:"margin:0"},p?"Editar ficha":"Nueva ficha"),h("label",{},"Nombre completo"),f.n,
    h("div",{class:"row"},h("div",{},h("label",{},"Edad"),f.a),h("div",{},h("label",{},"Posición"),f.p)),
    h("label",{},"Categoría donde juega"),f.c,h("datalist",{id:"cats"},cats().map(c=>h("option",{value:c}))),
    h("label",{},"Características"),f.k,
    h("div",{class:"foot"},h("button",{class:"sec",onclick:()=>$("dlg").close()},"Cancelar"),h("button",{onclick:async()=>{

}

/* ---------- Citaciones ---------- */
function viewMatches(){

    L.length?h("div",{class:"grid"},L.map(m=>h("div",{class:"card",style:"cursor:pointer",onclick:()=>{cur=JSON.parse(JSON.stringify(m));cur.tit=cur.tit||{};cur.sup=cur.sup||[];cur.st=cur.st||{};v="match";render()}},
      h("h3",{},"vs "+(m.rival||"Rival")),h("div",{class:"tags"},[fdate(m.fecha),m.torneo,m.gf!=null&&m.gc!=null?"Resultado "+m.gf+" - "+m.gc:""].filter(Boolean).map(x=>h("span",{class:"tag"},x))),
      h("p",{},Object.keys(m.tit||{}).length+" titulares · "+(m.sup||[]).length+" suplentes")))):h("div",{class:"empty"},"Todavía no hay citaciones.")];
}

  dlg(h("h2",{style:"margin:0"},"Nueva citación"),h("label",{},"Rival"),f.r,h("label",{},"Fecha"),f.d,h("label",{},"Torneo"),f.t,h("label",{},"Lugar"),f.l,h("label",{},"Formación"),f.f,
    h("div",{class:"foot"},h("button",{class:"sec",onclick:()=>$("dlg").close()},"Cancelar"),h("button",{onclick:async()=>{
      const m={id:"m"+uid(),rival:f.r.value.trim(),fecha:f.d.value,torneo:f.t.value.trim(),lugar:f.l.value.trim(),formacion:f.f.value,tit:{},sup:[],staff:"",gf:null,gc:null,st:{}};
      try{await put("matches",m,true);D.matches.some(x=>x.id===m.id)||D.matches.push(m);cur=m;v="match";$("dlg").close();render()}catch(e){alert("No se pudo crear.")}}},"Crear")));
}
function pick(onPick,onClear){
  const taken=new Set([...Object.values(cur.tit),...cur.sup]);const s=h("input",{type:"search",placeholder:"Buscar…"}),box=h("div",{style:"max-height:50vh;overflow:auto;margin-top:8px"});
  const draw=()=>{box.textContent="";const t=s.value.toLowerCase();D.players.filter(p=>!taken.has(p.id)&&p.nombre.toLowerCase().includes(t)).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"))
    .forEach(p=>box.append(h("div",{class:"pl",onclick:()=>{onPick(p.id);$("dlg").close()}},h("span",{},p.nombre),h("span",{style:"color:var(--mu);font-size:.85rem"},[p.posicion,p.categoria].filter(Boolean).join(" · ")))));
    if(!box.children.length)box.append(h("div",{class:"empty"},"No hay jugadores disponibles."))};
  s.oninput=draw;draw();
  dlg(h("h2",{style:"margin:0 0 8px"},"Elegir jugador"),s,box,h("div",{class:"foot"},onClear&&h("button",{class:"del",onclick:()=>{onClear();$("dlg").close()}},"Quitar"),h("button",{class:"sec",onclick:()=>$("dlg").close()},"Cerrar")));
}
function viewMatch(){
  const m=cur,ed=canEdit;
  const up=(k,val)=>{m[k]=val;saveCur()};
  const head=h("div",{class:"card"},
    h("div",{class:"row"},h("div",{},h("label",{},"Rival"),h("input",{value:m.rival||"",disabled:!ed,oninput:e=>up("rival",e.target.value)})),h("div",{},h("label",{},"Fecha"),h("input",{type:"date",value:m.fecha||"",disabled:!ed,oninput:e=>up("fecha",e.target.value)}))),
    h("div",{class:"row"},h("div",{},h("label",{},"Torneo"),h("input",{value:m.torneo||"",disabled:!ed,oninput:e=>up("torneo",e.target.value)})),h("div",{},h("label",{},"Lugar"),h("input",{value:m.lugar||"",disabled:!ed,oninput:e=>up("lugar",e.target.value)}))),
    h("div",{class:"row"},h("div",{},h("label",{},"Formación"),h("select",{value:m.formacion,disabled:!ed,onchange:e=>{up("formacion",e.target.value);drawPitch()}},FORM.map(x=>h("option",{value:x},x)))),
      h("div",{},h("label",{},"Goles a favor"),h("input",{type:"number",min:0,value:m.gf??"",disabled:!ed,oninput:e=>up("gf",e.target.value===""?null:+e.target.value)})),
      h("div",{},h("label",{},"Goles en contra"),h("input",{type:"number",min:0,value:m.gc??"",disabled:!ed,oninput:e=>up("gc",e.target.value===""?null:+e.target.value)}))));
  const pitch=h("div",{class:"pitch"}),bench=h("div",{class:"chips"}),stats=h("div",{class:"tw"});
  function drawPitch(){pitch.textContent="";slots(m.formacion).forEach((s,i)=>{const id=m.tit[i];
    pitch.append(h("div",{class:"slot"+(id?"":" empty-s"),style:"left:"+s.x+"%;top:"+s.y+"%",onclick:()=>ed&&pick(x=>{m.tit[i]=x;saveCur();drawPitch();drawBench();drawStats()},id?()=>{delete m.tit[i];saveCur();drawPitch();drawStats()}:null)},
      h("div",{class:"shirt"},i+1),h("div",{class:"sn"},id?pn(id):"")))})}

    ed&&bench.append(h("button",{class:"sec",onclick:()=>pick(x=>{m.sup.push(x);saveCur();drawBench();drawStats()})},"+ Suplente"))}
  const ids=()=>Object.keys(m.tit).map(Number).sort((a,b)=>a-b).map(k=>m.tit[k]).concat(m.sup);
  function step(id,k){const s=m.st[id]=m.st[id]||{},n=()=>s[k]||0,o=h("b",{},n());
    return h("span",{class:"stp"},ed&&h("button",{onclick:()=>{s[k]=Math.max(0,n()-1);o.textContent=n();saveCur()}},"−"),o,ed&&h("button",{onclick:()=>{s[k]=n()+1;o.textContent=n();saveCur()}},"+"))}

    stats.append(h("table",{},h("tr",{},["Jugador","Goles","Amarillas","Rojas","Minutos"].map(x=>h("th",{},x))),
      L.map(id=>{m.st[id]=m.st[id]||{};return h("tr",{},h("td",{},pn(id)),h("td",{},step(id,"goles")),h("td",{},step(id,"amarillas")),h("td",{},step(id,"rojas")),

  drawPitch();drawBench();drawStats();
  return [h("div",{class:"bar"},h("button",{class:"sec",onclick:()=>{clearTimeout(tm);v="matches";render()}},"← Citaciones"),ed&&h("button",{class:"del",onclick:async()=>{if(confirm("¿Eliminar este partido y sus estadísticas?"))try{clearTimeout(tm);await del("matches",m.id);v="matches";render()}catch(e){alert("No se pudo eliminar.")}}},"Eliminar partido")),
    head,h("h2",{},"Citación"),pitch,h("div",{class:"bar",style:"margin-top:14px;justify-content:center"},h("button",{onclick:()=>exportSheet("jpg")},"Descargar JPG"),h("button",{class:"sec",onclick:()=>exportSheet("pdf")},"Descargar PDF")),h("h2",{},"Suplentes"),bench,
    h("h2",{},"Cuerpo técnico"),h("textarea",{rows:4,disabled:!ed,placeholder:"DT …\nAC …\nPF …",value:m.staff||"",oninput:e=>up("staff",e.target.value)}),
    h("h2",{},"Estadísticas del partido"),stats];
}

/* ---------- Exportar ---------- */
function sheet(){
  const W=1240,H=1754,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d"),m=cur;
  const F=(w,s)=>x.font=w+" "+s+"px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";

  x.textAlign="center";x.fillStyle="#17201a";F("800",64);x.fillText("CITACIÓN",W/2,100);
  F("700",46);x.fillText("vs "+(m.rival||"Rival"),W/2,166);
  F("500",30);x.fillStyle="#5d6b61";x.fillText([m.torneo,fdate(m.fecha),m.lugar,"Formación "+m.formacion].filter(Boolean).join("  ·  "),W/2,214);
  const px=200,py=250,pw=840,ph=1030;

    if(id){const w=pn(id).split(" "),l=w.length>1?[w.slice(0,-1).join(" "),w[w.length-1]]:[w[0]];
      F("800",27);x.lineWidth=5;x.strokeStyle="#000";l.forEach((t,k)=>{x.strokeText(t,sx,sy+66+k*30);});x.fillStyle="#fff";l.forEach((t,k)=>{x.fillText(t,sx,sy+66+k*30)})}
  });

  x.fillStyle="#17201a";F("500",30);
  m.sup.slice(0,9).forEach((id,i)=>x.fillText((12+i)+"   "+pn(id),90,y0+50+i*40));

  return c;
}
function makePdf(jpg,w,h){const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const add=b=>{b=typeof b==="string"?enc.encode(b):b;parts.push(b);len+=b.length};
  const obj=(n,s)=>{off[n]=len;add(n+" 0 obj\n"+s+"\nendobj\n")};
  add("%PDF-1.4\n");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>");
  const cs="q 595 0 0 842 0 0 cm /Im0 Do Q";obj(4,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
  off[5]=len;add("5 0 obj\n<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");add(jpg);add("\nendstream\nendobj\n");
  const xr=len;let s="xref\n0 6\n0000000000 65535 f \n";for(let i=1;i<=5;i++)s+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  add(s+"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function exportSheet(kind){
  let dl=null;try{dl=await claude.use("downloads")}catch(e){}
  const save=async(n,d)=>{if(dl)return dl.save({filename:n,data:d});const a=document.createElement("a");a.href=URL.createObjectURL(d);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
  const cv=sheet(),blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.92));
  const base="citacion-"+(cur.rival||"partido").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-")+(cur.fecha?"-"+cur.fecha:"");
  try{if(kind==="jpg")await save(base+".jpg",blob);else await save(base+".pdf",makePdf(new Uint8Array(await blob.arrayBuffer()),cv.width,cv.height))}
  catch(e){if(!e||e.code!=="declined")alert("No se pudo descargar el archivo.")}
}

/* ---------- Estadísticas ---------- */
function viewStats(){
  const A={};for(const m of D.matches)for(const[id,s]of Object.entries(m.st||{})){const a=A[id]=A[id]||{c:0,pj:0,g:0,y:0,r:0,min:0};a.c++;if(s.minutos>0)a.pj++;a.g+=s.goles||0;a.y+=s.amarillas||0;a.r+=s.rojas||0;a.min+=s.minutos||0}
  const L=Object.entries(A).sort((a,b)=>b[1].g-a[1].g||b[1].min-a[1].min);
  return [h("p",{class:"sub"},D.matches.length+" partidos registrados. Los datos se acumulan hasta que elimines un partido."),
    L.length?h("div",{class:"tw"},h("table",{},h("tr",{},["Jugador","Conv.","PJ","Goles","Amarillas","Rojas","Minutos"].map(x=>h("th",{},x))),
      L.map(([id,a])=>h("tr",{},h("td",{},pn(id)),[a.c,a.pj,a.g,a.y,a.r,a.min].map(x=>h("td",{},x)))))):h("div",{class:"empty"},"Todavía no hay estadísticas. Se cargan dentro de cada citación.")];
}

function dlJson(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="copia-plantel.json";a.click()}
async function impJson(e){const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!confirm("Esto reemplaza los datos actuales de este navegador. ¿Continuar?"))return;for(const c of ["players","matches"]){D[c]=Array.isArray(j[c])?j[c]:[];persist(c)}render()}catch(x){alert("Archivo no válido.")}}
/* ---------- Shell ---------- */
function render(){
  const T=[["db","Base de datos"],["matches","Citaciones"],["stats","Estadísticas"]];
  $("nav").textContent="";T.forEach(([k,t])=>$("nav").append(h("button",{class:(v===k||(v==="match"&&k==="matches"))?"on":"",onclick:()=>{clearTimeout(tm);v=k;render()}},t)));
  const a=$("app");a.textContent="";a.append(...(v==="db"?viewDb():v==="matches"?viewMatches():v==="match"?viewMatch():viewStats()));
}
(async function init(){
  let user=null;try{user=await claude.use("user");db=await claude.use("db")}catch(e){}
  if(db){
    canEdit=user?user.canEdit():false;
    for(const c of ["players","matches"])db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(v!=="match")render()},()=>{$("note").textContent="Error al leer los datos."});
  }else{
    local=true;canEdit=true;
    for(const c of ["players","matches"])try{D[c]=JSON.parse(localStorage.getItem("gp_"+c)||"[]")}catch(e){}
    $("note").append("Los datos se guardan solo en este navegador y dispositivo. Hacé copias de seguridad seguido. ",h("button",{class:"sec",onclick:dlJson},"Exportar copia"),"  ",h("button",{class:"sec",onclick:()=>$("imp").click()},"Importar copia"),h("input",{id:"imp",type:"file",accept:".json",hidden:true,onchange:impJson}));
  }
  render();
})();
</script>
